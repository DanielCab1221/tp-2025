spring.application.name=gestion-svc
spring.datasource.url=jdbc:postgresql://postgres:5432/appdb
spring.datasource.username=${DB_USERNAME:appuser}
spring.datasource.password=${DB_PASSWORD:apppwd}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuración de RabbitMQ para JMS de HabitacionService
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin

rabbitmq.exchange=dan.exchange
rabbitmq.routingkey=dan.habitacion.#

logging.level.edu.utn.frsf.isi.dan.gestion=DEBUG

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoints.enabled-by-default=true
management.endpoint.shutdown.enabled=true



