spring.application.name=reservas-svc
spring.data.mongodb.uri=mongodb://${DB_USERNAME:root}:${DB_PASSWORD:rootpwd}@mongodb:27017/reservas?authSource=admin
spring.data.mongodb.auto-index-creation=true

# Configuración de RabbitMQ
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin
spring.amqp.deserialization.trust.all=true

logging.level.edu.utn.frsf.isi.dan.reservas_svc=DEBUG

# Limpieza de reservas RESERVADA sin sena: cada cuanto correr el chequeo (ms) y
# a partir de cuantas horas sin pago se considera vencida.
reserva.expiracion.chequeo-ms=3600000
reserva.expiracion.horas=24

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoints.enabled-by-default=true
management.endpoint.shutdown.enabled=true
